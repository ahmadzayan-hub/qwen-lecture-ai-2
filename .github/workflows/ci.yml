name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # --frozen-lockfile so a drifting pnpm-lock.yaml fails here rather
      # than silently resolving different versions than the ones verified.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Build last: it is the slowest step and the one most likely to be
      # fixed by whatever typecheck or the tests already caught.
      - name: Build
        run: pnpm build
